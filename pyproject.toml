[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurabyte-security"
version = "0.2.0"
description = "AURABYTE Security Terminal (AST) - Terminal profesional de pentesting y analisis de seguridad en espanol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AURABYTE" }
]
keywords = ["pentesting", "seguridad", "ciberseguridad", "cli", "tui", "terminal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
    "Natural Language :: Spanish",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "textual>=1.0.0",
    "defusedxml>=0.7.1",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
est = "eurabyte_security.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eurabyte_security.integrations" = ["plantillas_nuclei/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
