[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurabyte-security"
version = "0.1.0"
description = "Eurabyte Security Terminal (EST) - Terminal profesional de pentesting y analisis de seguridad en espanol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Eurabyte Security" }
]
keywords = ["pentesting", "seguridad", "ciberseguridad", "cli", "terminal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
    "Natural Language :: Spanish",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
est = "eurabyte_security.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
