name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar AST en modo desarrollo (incluye Textual para la interfaz visual)
        run: python -m pip install -e ".[dev]"

      - name: Analisis estatico (ruff)
        run: ruff check .

      - name: Ejecutar pruebas (pytest, incluye la CLI y la interfaz Textual)
        run: pytest -v

      - name: Comprobar que el comando 'est' funciona
        run: est --ayuda

      - name: Comprobar que 'est interfaz' esta registrado (sin abrir la TUI)
        run: |
          python -c "from typer.main import get_command; from eurabyte_security.cli.app import app; assert 'interfaz' in get_command(app).commands"
