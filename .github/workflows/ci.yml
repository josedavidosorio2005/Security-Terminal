name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar EST en modo desarrollo
        run: python -m pip install -e ".[dev]"

      - name: Analisis estatico (ruff)
        run: ruff check .

      - name: Ejecutar pruebas (pytest)
        run: pytest -v

      - name: Comprobar que el comando 'est' funciona
        run: est --ayuda
